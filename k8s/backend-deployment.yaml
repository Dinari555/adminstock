apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: depot-dashboard
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: your-registry.io/depot-dashboard-backend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 5000
        env:
        - name: NODE_ENV
          valueFrom:
            configMapKeyRef:
              name: depot-config
              key: NODE_ENV
        - name: PORT
          valueFrom:
            configMapKeyRef:
              name: depot-config
              key: PORT
        - name: MONGO_URI
          valueFrom:
            secretKeyRef:
              name: depot-secrets
              key: mongo-uri
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: depot-secrets
              key: jwt-secret
        - name: JWT_REFRESH_SECRET
          valueFrom:
            secretKeyRef:
              name: depot-secrets
              key: jwt-refresh-secret
        - name: JWT_EXPIRES_IN
          valueFrom:
            configMapKeyRef:
              name: depot-config
              key: JWT_EXPIRES_IN
        - name: JWT_REFRESH_EXPIRES_IN
          valueFrom:
            configMapKeyRef:
              name: depot-config
              key: JWT_REFRESH_EXPIRES_IN
        - name: FRONTEND_URL
          valueFrom:
            configMapKeyRef:
              name: depot-config
              key: FRONTEND_URL
        livenessProbe:
          httpGet:
            path: /api/v1/health
            port: 5000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/v1/health
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 5
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: depot-dashboard
spec:
  selector:
    app: backend
  ports:
  - port: 5000
    targetPort: 5000
  type: ClusterIP



